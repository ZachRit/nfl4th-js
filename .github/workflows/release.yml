name: Release

# Publishes to npm when a version tag is pushed. npm authenticates this
# workflow through trusted publishing (GitHub OIDC), so no token is stored, and
# attaches a provenance attestation on its own. The trusted publisher on
# npmjs.com names this file, release.yml.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # prepack builds dist/ first.
      - run: npm publish
